# Render Blueprint for the Disney World Tracker API.
#
# This provisions the Fastify API as a free-tier Web Service. The backing
# services (Postgres, Redis, object storage) are NOT created here — they live
# on Neon, Upstash, and Cloudflare R2 respectively (see
# .kiro/specs/disney-world-tracker/hosting.md). You paste their credentials
# into the environment variables below from the Render dashboard.
#
# Deploy: push this file to your repo, then in Render choose
# "New +" -> "Blueprint" and point it at this repository/branch.

services:
  - type: web
    name: dwt-api
    runtime: node
    plan: free
    region: ohio # US East — keep all providers in the same region for latency
    branch: develop # the branch Render auto-deploys
    # Install the whole workspace (lockfile-exact), build the shared package
    # that the API imports, compile the API to dist/, then apply any pending
    # SQL migrations. Migrations live in the build step because Render's free
    # tier does not support a separate preDeployCommand; they are idempotent,
    # so re-running on every deploy just skips already-applied files.
    #
    # `--include=dev` is required: NODE_ENV=production (set below, needed at
    # runtime) otherwise makes npm omit devDependencies, but the build needs
    # them (typescript, @types/*, tsx for migrations). Runtime `npm start`
    # only uses production deps, so shipping dev deps in the image is harmless.
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build --workspace apps/api && npm run migrate --workspace apps/api
    startCommand: npm start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the config falls back to 3000 locally.
      # The remaining values are secrets — set them in the dashboard, not in git.
      - key: DATABASE_URL # Neon pooled connection string (?sslmode=require)
        sync: false
      - key: REDIS_URL # Upstash rediss:// URL (TLS)
        sync: false
      - key: S3_ENDPOINT # https://<accountid>.r2.cloudflarestorage.com
        sync: false
      - key: S3_BUCKET # e.g. avatars-dev
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Disney Sync Gateway HTTP Basic Static_Credentials. Required — the API
      # fails fast at startup without them. Obtain locally with
      # `node tools/pull-disney-creds.mjs` and paste the values here (secrets,
      # not committed). Re-set if Disney rotates them.
      - key: DISNEY_SYNC_GATEWAY_USERNAME
        sync: false
      - key: DISNEY_SYNC_GATEWAY_PASSWORD
        sync: false
      - key: THEMEPARKS_BASE_URL
        value: https://api.themeparks.wiki/v1
      # 256-bit session signing secret — generated once by Render and kept stable.
      - key: SESSION_SECRET
        generateValue: true
