<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ladder frame shape</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0a17;color:#f1f5f9;font-family:'Segoe UI',system-ui,sans-serif;padding:32px 26px}
h1{font-size:24px;font-weight:800;margin-bottom:6px;background:linear-gradient(120deg,#fff,#f8db79 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:#a8b0c0;max-width:840px;line-height:1.6;font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px;max-width:1080px;margin:18px auto 0}
.card{background:#161226;border:1px solid #2a2140;border-radius:16px;padding:20px 14px;text-align:center}
.stage{width:180px;height:180px;margin:0 auto 10px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
.cap{font-size:15px;font-weight:700;color:#fff}
</style></head><body>
<h1>Ladder frame shape — pick one</h1>
<p>Same content (cloche + stars + banner, gold) in different frame shapes. Whatever you pick becomes the frame for all star-ladders (dining, squad, festival, snacks). The circle (first) is the current one.</p>
<div class="row" id="row"></div>
<script>
const GOLD=['#fff8db','#f8db79','#e5ab2c','#8c620f'];
const stops=c=>c.map((x,i)=>`<stop offset="${(i/(c.length-1)).toFixed(3)}" stop-color="${x}"/>`).join('');
const CLOCHE="M2 19v-2h20v2zm1-3v-1q0-3.2 1.963-5.65T10 6.25V6q0-.825.588-1.412T12 4t1.413.588T14 6v.25q3.1.65 5.05 3.1T21 15v1z";
function star(cx,cy,R){const r=R*0.42,p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;p.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1));}return `<polygon points="${p.join(' ')}" fill="#ffe08a" stroke="#a5641a" stroke-width="0.8" stroke-linejoin="round"/>`;}
function scallop(cx,cy,R,N){let pts=[];for(let i=0;i<N;i++){const a=i*2*Math.PI/N;pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);}const b=(R*Math.sin(Math.PI/N)*1.35).toFixed(1);let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;for(let i=1;i<=N;i++){const p=pts[i%N];d+=` A${b} ${b} 0 0 1 ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;}return d+' Z';}
const SHAPES={
 circle:{d:'M9 75 A66 66 0 1 0 141 75 A66 66 0 1 0 9 75 Z', label:'Circle (current)'},
 shield:{d:'M19 17 H131 V71 C131 107 108 131 75 143 C42 131 19 107 19 71 Z', label:'Shield'},
 gem:{d:'M75 7 L127 38 L127 104 L75 143 L23 104 L23 38 Z', label:'Faceted gem'},
 arch:{d:'M75 6 C104 6 128 30 128 59 V126 A10 10 0 0 1 118 136 H32 A10 10 0 0 1 22 126 V59 C22 30 46 6 75 6 Z', label:'Arch'},
 scallop:{d:scallop(75,75,66,16), label:'Scalloped medallion'},
 rounded:{d:'M30 12 H120 A18 18 0 0 1 138 30 V120 A18 18 0 0 1 120 138 H30 A18 18 0 0 1 12 120 V30 A18 18 0 0 1 30 12 Z', label:'Rounded square'},
};
let uid=0;
function pin(shape){
 const id='p'+(++uid),n=4;
 let stars='';const a0=-168*Math.PI/180,a1=-12*Math.PI/180;for(let i=0;i<n;i++){const t=i/(n-1),a=a0+(a1-a0)*t;stars+=star(75+42*Math.cos(a),66+42*Math.sin(a),6.5);}
 const innerT='translate(75,75) scale(0.85) translate(-75,-75)';
 return `<svg viewBox="-4 -4 158 158" width="180" height="180">
  <defs><linearGradient id="g${id}" x1=".15" y1="0" x2=".85" y2="1">${stops(GOLD)}</linearGradient>
   <clipPath id="w${id}"><path d="${shape.d}" transform="${innerT}"/></clipPath></defs>
  <path d="${shape.d}" fill="url(#g${id})"/>
  <path d="${shape.d}" transform="${innerT}" fill="#7a2d1f"/>
  <g clip-path="url(#w${id})">${stars}
    <g transform="translate(75,82) scale(2.1) translate(-12,-12)"><path d="${CLOCHE}" fill="#ffe9c7"/></g></g>
  <path d="M50 112 H100 L94 119.5 L100 127 H50 L56 119.5 Z" fill="#120b16" stroke="url(#g${id})" stroke-width="1.4"/>
  <text x="75" y="121.5" text-anchor="middle" dominant-baseline="central" font-family="Georgia,serif" font-weight="700" font-size="12" fill="#ffe08a">45</text>
  <path d="${shape.d}" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="1"/></svg>`;
}
document.getElementById('row').innerHTML=Object.values(SHAPES).map(s=>`<div class="card"><div class="stage">${pin(s)}</div><div class="cap">${s.label}</div></div>`).join('');
</script></body></html>
