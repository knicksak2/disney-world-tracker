<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pin Challenge Motif Replacements — 100% Rule-Compliant Cloisonné Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07040f;
      --card-bg: rgba(20, 15, 38, 0.95);
      --border: rgba(147, 112, 219, 0.3);
      --accent: #b5721a;
      --silver: #e2e8f0;
      --bronze: #d97706;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 40px 20px;
      margin: 0;
      line-height: 1.5;
    }
    .header {
      max-width: 1200px;
      margin: 0 auto 36px;
      text-align: center;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      margin: 0 0 8px;
      letter-spacing: -0.5px;
    }
    p.sub {
      color: #94a3b8;
      font-size: 15px;
      max-width: 850px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(560px, 1fr));
      gap: 28px;
      max-width: 1350px;
      margin: 0 auto;
    }
    .comparison-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .comparison-card:hover {
      border-color: rgba(245, 158, 11, 0.5);
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 12px;
    }
    .pin-name {
      font-family: 'Outfit', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: #fff;
    }
    .criteria {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .tier-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .tier-badge.silver { background: rgba(226, 232, 240, 0.15); color: #e2e8f0; border: 1px solid rgba(226, 232, 240, 0.4); }
    .tier-badge.bronze { background: rgba(217, 119, 6, 0.15); color: #f59e0b; border: 1px solid rgba(217, 119, 6, 0.4); }

    .compare-boxes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .box {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 14px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      min-height: 290px;
      justify-content: space-between;
    }
    .box.current { border: 1px dashed rgba(239, 68, 68, 0.45); }
    .box.proposed { border: 1px solid rgba(16, 185, 129, 0.45); background: rgba(16, 185, 129, 0.05); }
    .box-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      display: inline-block;
    }
    .box.current .box-tag { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .box.proposed .box-tag { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .box-info { margin-top: 12px; width: 100%; }
    .box-title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: 'Outfit', sans-serif;
    }
    .box-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.35;
    }
    .verdict {
      font-size: 13px;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--accent);
      color: #cbd5e1;
    }
    .verdict b { color: #fff; }
    .dedup-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #10b981;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 6px;
    }
  </style>
</head>

      photoCamera: "M41 122.496v14h62v-14zm154.73 0l-32 32H137v46h30.682C192.4 159.898 237.08 132.738 288 132.738s95.6 27.16 120.318 67.758H487v-46h-74.73l-32-32c-92.27-9-92.27-9-184.54 0M288 150.738c-67.903 0-122.758 54.855-122.758 122.758S220.097 396.254 288 396.254s122.758-54.855 122.758-122.758S355.903 150.738 288 150.738m-263 3.758v46h94v-46zm263 14.713c57.49 0 104.287 46.796 104.287 104.286S345.49 377.783 288 377.783s-104.287-46.797-104.287-104.287S230.51 169.209 288 169.209m-21.787 22.042c-12.173.42-25.717 6.526-36.78 16.578c-20.025 18.19-26.342 43.853-14.11 57.318s38.38 9.634 58.406-8.558c20.023-18.192 26.34-43.855 14.108-57.32c-5-5.504-12.62-8.33-21.625-8.018zM25 218.496v142h94v-142zm112 0v142h40.412c-18.888-23.96-30.17-54.183-30.17-87c0-19.507 3.988-38.096 11.188-55zm280.57 0c7.2 16.904 11.188 35.493 11.188 55c0 32.817-11.282 63.04-30.17 87H487v-142zM25 378.496v14h94v-14zm112 0v14h75.89a141.5 141.5 0 0 1-18.536-14zm244.646 0a141.6 141.6 0 0 1-18.535 14H487v-14z",
      tikiMacaw: "M246 18.844c-2.157.02-4.292.068-6.406.156c-73.28 3.064-120.385 46.286-139.406 94.094c-11.706 29.42-12.328 60.463-1.813 84.78c10.515 24.32 31.522 42.552 66.906 47.845c18.85 2.818 37.402 5.89 55.314 9.5c59.88-25.15 71.217-72.16 86.625-115.19c7.735-21.602 16.277-42.437 33.874-56.655c12.758-10.31 29.792-16.212 52.47-16.563c-28.51-20.475-62.022-35.544-99.095-43.093c-17.22-3.507-33.372-5.024-48.47-4.876zm147.47 66.53c-19.04.243-31.413 5.12-40.626 12.564c-12.818 10.356-20.528 27.42-28.03 48.374c-13.216 36.904-26.567 85.154-75.752 115.282c42.035 10.47 78.926 24.997 105.188 47.5c21.364 18.306 35.342 42.586 37.406 72.75c1.54 22.492-3.3 47.973-15.25 77.187C477.462 385.23 506.27 291.847 488.844 209.75c-9.833-46.322-34.647-89.155-70.344-122.5c-9.447-1.382-17.738-1.968-25.03-1.875zm-308.376 15.44c-20.48 6.425-42.002 17.384-64.28 33.655l-.002 359.155h230.875c11.166-23.298 19.82-46.743 26.188-69.97c-34.545-1.148-67.374-12.59-94.563-31.06c-48.912-33.232-80.487-89.767-72.25-149.22c-13.442-10.208-23.455-23.32-29.843-38.094c-12.89-29.806-11.65-65.73 1.624-99.093c.717-1.802 1.46-3.587 2.25-5.374zm144.656 27.124c23.412 0 42.406 18.968 42.406 42.374s-18.994 42.375-42.406 42.375s-42.375-18.968-42.375-42.375c0-23.406 18.963-42.375 42.375-42.375zM128.78 254.125c-3.5 48.926 23.382 94.734 65.032 123.03c44.693 30.365 105.29 39.94 162.657 9.658a146 146 0 0 1-17.376-3.907c-13.214-17.616-20.057-42.566-18.688-63.187a70 70 0 0 1 1.5-10.533c-5.35-3.108-11.05-6.05-17.094-8.812c-1.66 5.77-2.648 11.858-3.062 18.094c-1.14 17.168 2.01 35.7 9.188 52.592c-35.888-20.445-55.414-55.432-58.22-88.875c-27.608-7.465-58.322-13.202-90.187-17.968c-12.5-1.87-23.76-5.332-33.75-10.095z"
    });

    function stops(cols){
      return cols.map((c,i) => `<stop offset="${(i/(cols.length-1)).toFixed(4)}" stop-color="${c}"/>`).join('');
    }

    function tokenizePath(d){
      const tokens = [];
      const re = /([a-df-z])|([+-]?(?:\d*\.\d+|\d+)(?:[eE][+-]?\d+)?)/gi;
      let m, curCmd = null, nums = [];
      while ((m = re.exec(d)) !== null) {
        if (m[1]) {
          if (curCmd) tokens.push({ cmd: curCmd, nums });
          curCmd = m[1]; nums = [];
        } else nums.push(parseFloat(m[2]));
      }
      if (curCmd) tokens.push({ cmd: curCmd, nums });
      return tokens;
    }

    function splitCells(d){
      const cells = [];
      let cur = null, cx = 0, cy = 0, sx = 0, sy = 0;
      for (const { cmd, nums } of tokenizePath(d)) {
        const rel = cmd === cmd.toLowerCase(), k = cmd.toLowerCase();
        if (k === 'm') {
          const nx = rel ? cx + nums[0] : nums[0], ny = rel ? cy + nums[1] : nums[1];
          cx = sx = nx; cy = sy = ny;
          cur = { d: `M${+nx.toFixed(3)} ${+ny.toFixed(3)}` };
          cells.push(cur);
          for (let i = 2; i + 1 < nums.length; i += 2) {
            const lx = rel ? cx + nums[i] : nums[i], ly = rel ? cy + nums[i+1] : nums[i+1];
            cur.d += ` L${+lx.toFixed(3)} ${+ly.toFixed(3)}`; cx = lx; cy = ly;
          }
          continue;
        }
        if (!cur) { cur = { d: 'M0 0' }; cells.push(cur); }
        cur.d += ` ${cmd}${nums.join(' ')}`;
        const step = { l:2, h:1, v:1, c:6, s:4, q:4, t:2, a:7, z:0 }[k];
        if (k === 'z') { cx = sx; cy = sy; }
        else for (let i = 0; step && i + step <= nums.length; i += step) {
          const a = nums.slice(i, i + step);
          if (k === 'h')      cx = rel ? cx + a[0] : a[0];
          else if (k === 'v') cy = rel ? cy + a[0] : a[0];
          else if (k === 'a') { cx = rel ? cx + a[5] : a[5]; cy = rel ? cy + a[6] : a[6]; }
          else { cx = rel ? cx + a[step-2] : a[step-2]; cy = rel ? cy + a[step-1] : a[step-1]; }
        }
      }
      return cells.map(c => c.d);
    }

    function pathBBox(d){
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      let cx = 0, cy = 0, sx = 0, sy = 0;
      function update(x, y) {
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      }
      for (const { cmd, nums } of tokenizePath(d)) {
        const rel = cmd === cmd.toLowerCase();
        const k = cmd.toLowerCase();
        if (k === 'm') {
          for (let i = 0; i + 1 < nums.length; i += 2) {
            cx = rel ? cx + nums[i] : nums[i]; cy = rel ? cy + nums[i+1] : nums[i+1];
            if (i === 0) { sx = cx; sy = cy; }
            update(cx, cy);
          }
        } else if (k === 'l' || k === 't') {
          for (let i = 0; i + 1 < nums.length; i += 2) {
            cx = rel ? cx + nums[i] : nums[i]; cy = rel ? cy + nums[i+1] : nums[i+1];
            update(cx, cy);
          }
        } else if (k === 'h') {
          for (let i = 0; i < nums.length; i++) {
            cx = rel ? cx + nums[i] : nums[i]; update(cx, cy);
          }
        } else if (k === 'v') {
          for (let i = 0; i < nums.length; i++) {
            cy = rel ? cy + nums[i] : nums[i]; update(cx, cy);
          }
        } else if (k === 'c') {
          for (let i = 0; i + 5 < nums.length; i += 6) {
            const x1 = rel ? cx + nums[i] : nums[i], y1 = rel ? cy + nums[i+1] : nums[i+1];
            const x2 = rel ? cx + nums[i+2] : nums[i+2], y2 = rel ? cy + nums[i+3] : nums[i+3];
            const x  = rel ? cx + nums[i+4] : nums[i+4], y  = rel ? cy + nums[i+5] : nums[i+5];
            update(x1, y1); update(x2, y2); update(x, y);
            cx = x; cy = y;
          }
        } else if (k === 's' || k === 'q') {
          for (let i = 0; i + 3 < nums.length; i += 4) {
            const x1 = rel ? cx + nums[i] : nums[i], y1 = rel ? cy + nums[i+1] : nums[i+1];
            const x  = rel ? cx + nums[i+2] : nums[i+2], y  = rel ? cy + nums[i+3] : nums[i+3];
            update(x1, y1); update(x, y);
            cx = x; cy = y;
          }
        } else if (k === 'a') {
          for (let i = 0; i + 6 < nums.length; i += 7) {
            const x = rel ? cx + nums[i+5] : nums[i+5], y = rel ? cy + nums[i+6] : nums[i+6];
            update(x, y); cx = x; cy = y;
          }
        } else if (k === 'z') { cx = sx; cy = sy; }
      }
      if (minX === Infinity) { minX = 0; minY = 0; maxX = 512; maxY = 512; }
      return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY, cx: (minX+maxX)/2, cy: (minY+maxY)/2 };
    }

    function classifyCells(d){
      const cells = splitCells(d);
      if (cells.length < 2) return cells.map(() => false);
      return cells.map((c, i) => i > 0);
    }

    let uid = 0;

    function renderDieCut(o, ctx){
      const { id, metal, enamel, dPath, size } = ctx;
      const bb = pathBBox(dPath);
      const k  = ((o.dieBox || 122) / Math.max(bb.w, bb.h)) * (o.motifScale || 1);
      const tx = 75 - bb.cx * k;
      const ty = 75 - bb.cy * k;
      const t  = `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${k.toFixed(5)})`;
      const rimPx = o.rim || (RIM_BY_TIER[o.tier] || 5.2);
      const rim   = rimPx / k;

      const noSplit  = !!o.noSplit;
      const cellList = noSplit ? [dPath] : splitCells(dPath);
      const interior = noSplit ? [false] : classifyCells(dPath);
      const outerD = cellList.filter((c,i) => !interior[i]).join(' ');
      const innerD = cellList.filter((c,i) =>  interior[i]).join(' ');

      return `
    <svg width="${size}" height="${size}" viewBox="-4 -4 158 158" style="overflow:visible" role="img">
      <defs>
        <linearGradient id="g-${id}-p" x1=".15" y1="0" x2=".85" y2="1">${stops(metal)}</linearGradient>
        <linearGradient id="g-${id}-m" x1=".2" y1="0" x2=".8" y2="1">${stops(metal.slice(0, Math.max(3, metal.length-1)))}</linearGradient>
        <linearGradient id="g-${id}-gl" x1="0" y1="0" x2=".3" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="c-${id}"><path d="${dPath}" transform="${t}"/></clipPath>
        <filter id="f-${id}" x="-25%" y="-25%" width="150%" height="160%">
          <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#000" flood-opacity=".55"/>
        </filter>
      </defs>
      <g filter="url(#f-${id})">
        <g transform="${t}">
          ${cellList.map((cell,i) =>
            `<path d="${cell}" fill="${Array.isArray(enamel) ? enamel[i % enamel.length] : enamel}" fill-rule="nonzero"/>`
          ).join('')}
          ${innerD ? `<path d="${innerD}" fill="none" stroke="url(#g-${id}-p)"
                stroke-width="${(rim * (o.innerRim ?? 0.32)).toFixed(1)}"
                stroke-linejoin="round" stroke-linecap="round"/>` : ''}
          <path d="${outerD}" fill="none" stroke="url(#g-${id}-p)" stroke-width="${rim.toFixed(1)}"
                stroke-linejoin="round" stroke-linecap="round"/>
          <path d="${outerD}" fill="none" stroke="#000" stroke-opacity=".38"
                stroke-width="${(rim*0.22).toFixed(1)}" stroke-linejoin="round"/>
        </g>
        <g clip-path="url(#c-${id})">
          <ellipse cx="54" cy="46" rx="48" ry="30" transform="rotate(-26 54 46)" fill="url(#g-${id}-gl)"/>
        </g>
        <g clip-path="url(#c-${id})" fill="none">
          <path d="${outerD}" transform="${t}" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
        </g>
      </g>
    </svg>`;
    }

    // EXACT canonical renderPin from pin-catalog-mockup.html
    function renderPin(o){
      const size    = o.size || 138;
      const shape   = SHAPES[o.shape] || SHAPES.disc;
      const metal   = METALS[o.tier || 'gold'];
      const enamel  = PALETTES.royal[o.enamel] || o.enamel || PALETTES.royal.royal;
      const id      = 'p' + (++uid);
      const insetT  = `translate(75,75) scale(${shape.inset || 1}) translate(-75,-75)`;

      const well = shape.insetD
        ? `<path d="${shape.insetD}"/>`
        : `<path d="${shape.d}" transform="${insetT}"/>`;

      const dPath  = o.d || (MOTIFS && MOTIFS[o.motif]) || '';

      if (o.mode === 'diecut' || !o.shape) {
        return renderDieCut(o, { id, metal, enamel, dPath, size });
      }

      const bb = pathBBox(dPath);
      const mk = 0.1875 * (shape.mk || 1) * (o.motifScale || 1);
      const mcx = shape.mcx;
      const mcy = shape.mcy;
      
      const tx = bb ? (mcx - bb.cx * mk) : (mcx - 256 * mk);
      const ty = bb ? (mcy - bb.cy * mk) : (mcy - 256 * mk);
      const mtx = `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${mk.toFixed(5)})`;

      const motifFill = `url(#g-${id}-m)`;
      const motifEl = `<g transform="${mtx}" fill="${motifFill}"><path d="${dPath}"/></g>`;

      return `
    <svg width="${size}" height="${size}" viewBox="-4 -4 158 158" style="overflow:visible" role="img">
      <defs>
        <linearGradient id="g-${id}-p" x1=".15" y1="0" x2=".85" y2="1">${stops(metal)}</linearGradient>
        <linearGradient id="g-${id}-m" x1=".2" y1="0" x2=".8" y2="1">${stops(metal.slice(0, Math.max(3, metal.length-1)))}</linearGradient>
        <linearGradient id="g-${id}-gl" x1="0" y1="0" x2=".3" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="c-${id}"><path d="${shape.d}"/></clipPath>
        <clipPath id="cw-${id}">${well}</clipPath>
        <filter id="f-${id}" x="-25%" y="-25%" width="150%" height="160%">
          <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#000" flood-opacity=".55"/>
        </filter>
      </defs>

      <g filter="url(#f-${id})">
        <path d="${shape.d}" fill="url(#g-${id}-p)"/>
        <g fill="${enamel}">${well}</g>
        <g clip-path="url(#cw-${id})" fill="none" stroke="#000" stroke-opacity=".38" stroke-width="5">${well}</g>
        ${motifEl}
        <g clip-path="url(#c-${id})">
          <ellipse cx="54" cy="44" rx="48" ry="30" transform="rotate(-26 54 44)" fill="url(#g-${id}-gl)"/>
        </g>
        <g clip-path="url(#c-${id})" fill="none">
          <path d="${shape.d}" stroke="#fff" stroke-opacity=".42" stroke-width="2"/>
        </g>
        <path d="${shape.d}" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1"/>
      </g>
    </svg>`;
    }

    const COMPARISONS = [

      {

        currentPin: {

        }

      {

        currentPin: {

    const grid = document.getElementById('grid');

    COMPARISONS.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'comparison-card';

      const curSvg = renderPin(item.currentPin);
      const propSvg = renderPin(item.proposedPin);

      card.innerHTML = `
        <div class="card-header">
          <div>
            <div class="pin-name">${item.name}</div>

          <span class="tier-badge ${item.tier}">${item.tier}</span>
        </div>

        <div class="compare-boxes">
          <div class="box current">
            <span class="box-tag">Current (Flawed)</span>
            ${curSvg}
            <div class="box-info">
              <div class="box-title">${item.currentPin.title}</div>
              <div class="box-desc">${item.currentPin.desc}</div>
            </div>
          </div>

          <div class="box proposed">
            <span class="box-tag">Proposed Replacement</span>
            ${propSvg}

              <div class="box-title">${item.proposedPin.title}</div>

              <div class="dedup-tag">${item.proposedPin.dedup}</div>

          </div>

        <div class="verdict">

      `;

      grid.appendChild(card);
