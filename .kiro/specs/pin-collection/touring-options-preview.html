    const METALS = {
      bronze:   ['#f4d9c4', '#eec4a0', '#c28552', '#9a5526', '#643312'],
      silver:   ['#ffffff', '#ffffff', '#dfe4eb', '#b0b9c8', '#737f94'],
      gold:     ['#fff8db', '#fff2b8', '#ffd447', '#e5ab2c', '#8a5a0c'],
      amethyst: ['#f7e4ff', '#eec4fa', '#c778e8', '#8a45c9', '#4d2075']
    };
    const PALETTES = { royal: { ink: '#241a3a', crimson: '#a8323f', teal: '#14727f', forest: '#2f7d3e', sky: '#2f6bb0', royal: '#4a2a7a', plum: '#6a3fb0', amber: '#b5721a' } };
    const RIM_BY_TIER = { bronze: 4.2, silver: 5.2, gold: 6.2, amethyst: 7.2 };

    function stops(arr){
      return arr.map((c, i) => `<stop offset="${(i / (arr.length - 1)).toFixed(3)}" stop-color="${c}"/>`).join('');
    }

    let uid = 0;
    function renderDieCut(o) {
      const id = 'opt' + (++uid);
      const size = 130;
      const metal = METALS[o.tier || 'gold'];
      const dPath = window.MOTIF_LIB[o.motif] || '';
      const enamel = Array.isArray(o.enamel) ? o.enamel : [PALETTES.royal[o.enamel] || o.enamel || '#241a3a'];
      const rim = (RIM_BY_TIER[o.tier] || 6.2) / 0.24;

      return `
      <svg width="${size}" height="${size}" viewBox="-4 -4 158 158" style="overflow:visible">
        <defs>
          <linearGradient id="g-${id}-p" x1=".15" y1="0" x2=".85" y2="1">${stops(metal)}</linearGradient>
          <linearGradient id="g-${id}-gl" x1="0" y1="0" x2=".3" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="c-${id}"><path d="${dPath}" transform="translate(13.6, 13.6) scale(0.246)"/></clipPath>
          <filter id="f-${id}" x="-25%" y="-25%" width="150%" height="160%">
            <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#000" flood-opacity=".55"/>
          </filter>
        </defs>
        <g filter="url(#f-${id})">
          <g transform="translate(13.6, 13.6) scale(0.246)">
            <path d="${dPath}" fill="${enamel[0]}" fill-rule="evenodd"/>
            <path d="${dPath}" fill="none" stroke="url(#g-${id}-p)" stroke-width="${rim.toFixed(1)}" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="${dPath}" fill="none" stroke="#000" stroke-opacity=".38" stroke-width="${(rim*0.22).toFixed(1)}" stroke-linejoin="round"/>
          </g>
          <g clip-path="url(#c-${id})">
            <ellipse cx="54" cy="46" rx="48" ry="30" transform="rotate(-26 54 46)" fill="url(#g-${id}-gl)"/>
          </g>
        </g>
      </svg>`;
    }

    const PINS = [
      {
        tier: 'bronze',
        name: 'Two Parks in One Day',
        motif: 'bus',
        motifLabel: '🚌 Disney Motorcoach',
        enamel: 'crimson',
        desc: 'Log experiences in 2 distinct theme parks on the same date'
      },
      {
        tier: 'gold',
        name: 'Three Parks in One Day',
        motif: 'skyliner',
        motifLabel: '🚠 Skyliner Gondola',
        enamel: 'teal',
        desc: 'Log an experience in 3 distinct theme parks on a single date'
      },
      {
        tier: 'gold',
        name: 'Four Park Sampler',
        motif: 'subway',
        motifLabel: '🚝 Disney Monorail',
        enamel: 'sky',
        desc: 'Log an experience in all 4 theme parks on a single date'
      },
      {
        tier: 'gold',
        name: '10-Ride Single Day Sprint',
        motif: 'sprint',
        motifLabel: '🏃 Sprinter in Motion',
        enamel: 'amber',
        desc: 'Log 10 or more attraction visits on a single calendar date'
      },
      {
        tier: 'amethyst',
        name: 'Rope Drop to Fireworks',
        motif: 'sunrise',
        motifLabel: '🌅 Rope Drop Sunrise',
        enamel: 'crimson',
        desc: 'Log an attraction within 30 min of open AND after fireworks'
      }
    ];

    const grid = document.getElementById('grid');
    PINS.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <span class="tier-badge tier-${p.tier}">${p.tier}</span>
        <div>${renderDieCut(p)}</div>
        <div class="name">${p.name}</div>
        <div class="motif-label">${p.motifLabel}</div>
        <div class="desc">${p.desc}</div>
      `;
      grid.appendChild(card);
    });
  </script>
