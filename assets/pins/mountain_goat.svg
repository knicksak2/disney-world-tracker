<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2c2" />
      <stop offset="50%" style="stop-color:#e8b53d" />
      <stop offset="100%" style="stop-color:#8a5e0c" />
    </linearGradient>
    <linearGradient id="enamelBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5d4037" />
      <stop offset="100%" style="stop-color:#3e2723" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <!-- Triangular Frame -->
    <path d="M75 10 L140 120 L10 120 Z" fill="url(#goldMetal)" />
    <!-- Recessed Enamel -->
    <path d="M75 22 L128 112 L22 112 Z" fill="url(#enamelBrown)" />
    <!-- Mountain Peak (Raised Gold) -->
    <path d="M60 60 L75 22 L90 60 L75 50 Z" fill="url(#goldMetal)" />
    <!-- Snow Cap (White Enamel) -->
    <path d="M70 45 L75 22 L80 45 L75 35 Z" fill="white" />
    <!-- Gloss -->
    <path d="M40 70 L75 30 L110 70 Q75 55 40 70 Z" fill="url(#glossSheen)" />
    <!-- Banner -->
    <rect x="40" y="105" width="70" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="116" font-family="Arial, sans-serif" font-size="7" fill="#3e2723" text-anchor="middle" font-weight="900">MOUNTAIN GOAT</text>
  </g>
</svg>
