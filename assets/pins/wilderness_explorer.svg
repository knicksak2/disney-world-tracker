<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7d6"/><stop offset="50%" style="stop-color:#e6ac2e"/><stop offset="100%" style="stop-color:#8f6410"/>
    </linearGradient>
    <linearGradient id="enamelGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32"/><stop offset="100%" style="stop-color:#1b5e20"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4"/><stop offset="100%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Ornate Gold Frame -->
    <circle cx="75" cy="75" r="70" fill="url(#goldMetal)" />
    <!-- Recessed Enamel -->
    <circle cx="75" cy="75" r="62" fill="url(#enamelGreen)" />

    <!-- COMPASS ROSE (Etched Gold) -->
    <g stroke="url(#goldMetal)" stroke-width="1.5" fill="none">
      <circle cx="75" cy="75" r="55" stroke-dasharray="2 10" opacity="0.4" />
      <path d="M75 18 L82 65 L132 75 L82 85 L75 132 L68 85 L18 75 L68 65 Z" fill="url(#goldMetal)" stroke-width="0.5"/>
      <!-- Directional Letters -->
      <text x="75" y="32" font-family="Georgia" font-size="8" fill="url(#goldMetal)" text-anchor="middle" font-weight="900" stroke="none">N</text>
    </g>

    <!-- THE TREE (Multi-toned Enamel) -->
    <g transform="translate(75, 75)">
      <!-- Trunk (Brown Enamel) -->
      <path d="M-5 35 L5 35 L2 -5 L-2 -5 Z" fill="#5d4037" stroke="url(#goldMetal)" stroke-width="1" />
      <!-- Leaves (Layered Greens) -->
      <path d="M0 -35 Q25 -25 25 0 Q25 25 0 25 Q-25 25 -25 0 Q-25 -25 0 -35" fill="#4caf50" stroke="url(#goldMetal)" stroke-width="1" />
      <path d="M0 -25 Q15 -15 15 0 Q15 15 0 15 Q-15 15 -15 0 Q-15 -15 0 -25" fill="#81c784" opacity="0.6" />
    </g>

    <!-- Animal Track (Etched Gold) -->
    <circle cx="35" cy="100" r="3" fill="url(#goldMetal)" opacity="0.6" />
    <circle cx="30" cy="92" r="1.5" fill="url(#goldMetal)" opacity="0.6" />
    <circle cx="40" cy="92" r="1.5" fill="url(#goldMetal)" opacity="0.6" />

    <!-- Gloss -->
    <ellipse cx="75" cy="45" rx="55" ry="25" fill="url(#gloss)" transform="rotate(-15 75 45)" />

    <!-- Banner -->
    <rect x="30" y="115" width="90" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="6.5" fill="#3e2723" text-anchor="middle" font-weight="900">WILDERNESS EXPLORER</text>
  </g>
</svg>
