<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2c2" />
      <stop offset="50%" style="stop-color:#e8b53d" />
      <stop offset="100%" style="stop-color:#8a5e0c" />
    </linearGradient>
    <linearGradient id="enamelOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc80" />
      <stop offset="100%" style="stop-color:#ef6c00" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <circle cx="75" cy="75" r="70" fill="url(#goldMetal)" />
    <circle cx="75" cy="75" r="62" fill="url(#enamelOrange)" />
    <!-- Plate Motif (Raised White Enamel + Gold Metal) -->
    <circle cx="75" cy="65" r="35" fill="white" stroke="url(#goldMetal)" stroke-width="2" />
    <!-- Fork & Knife (Raised Gold) -->
    <path d="M60 50 L60 85 M55 50 L65 50" stroke="url(#goldMetal)" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 50 L90 85" stroke="url(#goldMetal)" stroke-width="6" stroke-linecap="round"/>
    <!-- Gold Star -->
    <path d="M75 90 L79 100 L88 100 L81 106 L84 115 L75 110 L66 115 L69 106 L62 100 L71 100 Z" fill="url(#goldMetal)" />
    <!-- Gloss -->
    <ellipse cx="75" cy="45" rx="55" ry="25" fill="url(#glossSheen)" transform="rotate(-15 75 45)" />
    <!-- Banner -->
    <rect x="40" y="115" width="70" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="7" fill="#3e2723" text-anchor="middle" font-weight="900">DINING CRITIC</text>
  </g>
</svg>
