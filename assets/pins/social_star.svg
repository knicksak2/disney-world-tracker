<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f6fb" />
      <stop offset="50%" style="stop-color:#c2c9d6" />
      <stop offset="100%" style="stop-color:#7d8598" />
    </linearGradient>
    <linearGradient id="enamelPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0" />
      <stop offset="100%" style="stop-color:#7b1fa2" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <!-- Ornate Circular Frame -->
    <circle cx="75" cy="75" r="70" fill="url(#silverMetal)" />
    <!-- Recessed Enamel Inner -->
    <circle cx="75" cy="75" r="62" fill="url(#enamelPurple)" />
    <!-- Heart Motif (Raised Silver + Pink Enamel) -->
    <path d="M75 95 C55 75 45 65 45 50 C45 40 55 35 65 35 C70 35 75 40 75 45 C75 40 80 35 85 35 C95 35 105 40 105 50 C105 65 95 75 75 95 Z" fill="#e91e63" stroke="url(#silverMetal)" stroke-width="3" />
    <!-- Friends Icons (Raised Silver) -->
    <circle cx="45" cy="45" r="8" fill="url(#silverMetal)" />
    <circle cx="105" cy="45" r="8" fill="url(#silverMetal)" />
    <!-- Gloss -->
    <ellipse cx="75" cy="45" rx="55" ry="25" fill="url(#glossSheen)" transform="rotate(-15 75 45)" />
    <!-- Banner -->
    <rect x="40" y="115" width="70" height="15" rx="7.5" fill="url(#silverMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="7" fill="#4a148c" text-anchor="middle" font-weight="900">SOCIAL STAR</text>
  </g>
</svg>
