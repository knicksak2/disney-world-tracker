<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2c2" />
      <stop offset="50%" style="stop-color:#e8b53d" />
      <stop offset="100%" style="stop-color:#8a5e0c" />
    </linearGradient>
    <linearGradient id="enamelPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec" />
      <stop offset="100%" style="stop-color:#f8bbd0" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <path d="M75 10 L140 45 L140 105 L75 140 L10 105 L10 45 Z" fill="url(#goldMetal)" />
    <path d="M75 18 L132 50 L132 100 L75 132 L18 100 L18 50 Z" fill="url(#enamelPink)" />
    <!-- Tiara Motif (Raised Gold + Gems) -->
    <g fill="none" stroke="url(#goldMetal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M45 90 Q75 40 105 90" />
      <path d="M45 90 L35 70 L60 80 L75 45 L90 80 L115 70 L105 90 Z" fill="#f48fb1" />
      <circle cx="75" cy="45" r="4" fill="url(#goldMetal)" stroke="none" />
      <circle cx="35" cy="70" r="3" fill="url(#goldMetal)" stroke="none" />
      <circle cx="115" cy="70" r="3" fill="url(#goldMetal)" stroke="none" />
    </g>
    <!-- Gloss -->
    <path d="M18 50 Q75 35 132 50 L132 75 Q75 60 18 75 Z" fill="url(#glossSheen)" />
    <!-- Banner -->
    <rect x="40" y="115" width="70" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="6" fill="#ad1457" text-anchor="middle" font-weight="900">PRINCESS ROYALTY</text>
  </g>
</svg>
