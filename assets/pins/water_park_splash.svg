<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f6fb" />
      <stop offset="50%" style="stop-color:#c2c9d6" />
      <stop offset="100%" style="stop-color:#7d8598" />
    </linearGradient>
    <linearGradient id="enamelBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4" />
      <stop offset="100%" style="stop-color:#0097a7" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <!-- Water Drop Frame -->
    <path d="M75 10 C75 10 135 70 135 110 A60 60 0 1 1 15 110 C15 70 75 10 75 10 Z" fill="url(#silverMetal)" />
    <!-- Recessed Blue Enamel -->
    <path d="M75 22 C75 22 125 75 125 108 A50 50 0 1 1 25 108 C25 75 75 22 75 22 Z" fill="url(#enamelBlue)" />
    <!-- Wave Motif (Raised Silver) -->
    <path d="M45 105 Q75 135 105 105" fill="none" stroke="url(#silverMetal)" stroke-width="6" stroke-linecap="round"/>
    <!-- Gloss -->
    <path d="M45 75 Q75 40 105 75 L105 95 Q75 60 45 95 Z" fill="url(#glossSheen)" />
    <!-- Banner -->
    <rect x="40" y="115" width="70" height="15" rx="7.5" fill="url(#silverMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="7" fill="#006064" text-anchor="middle" font-weight="900">SPLASH MASTER</text>
  </g>
</svg>
