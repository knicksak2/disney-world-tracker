<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2c2" />
      <stop offset="50%" style="stop-color:#e8b53d" />
      <stop offset="100%" style="stop-color:#8a5e0c" />
    </linearGradient>
    <linearGradient id="enamelPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ce93d8" />
      <stop offset="100%" style="stop-color:#9c27b0" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <circle cx="75" cy="75" r="70" fill="url(#goldMetal)" />
    <circle cx="75" cy="75" r="62" fill="url(#enamelPurple)" />
    <!-- Flower Motif (Raised Gold + Colorful Centers) -->
    <path d="M75 35 L85 60 L110 75 L85 90 L75 115 L65 90 L40 75 L65 60 Z" fill="none" stroke="url(#goldMetal)" stroke-width="4" />
    <circle cx="75" cy="75" r="15" fill="url(#goldMetal)" />
    <!-- Colorful Enamel Petals -->
    <circle cx="55" cy="55" r="5" fill="#ffeb3b" stroke="url(#goldMetal)" stroke-width="1"/>
    <circle cx="95" cy="55" r="5" fill="#03a9f4" stroke="url(#goldMetal)" stroke-width="1"/>
    <circle cx="55" cy="95" r="5" fill="#8bc34a" stroke="url(#goldMetal)" stroke-width="1"/>
    <circle cx="95" cy="95" r="5" fill="#ff5722" stroke="url(#goldMetal)" stroke-width="1"/>
    <!-- Gloss -->
    <ellipse cx="75" cy="45" rx="55" ry="25" fill="url(#glossSheen)" transform="rotate(-15 75 45)" />
    <!-- Banner -->
    <rect x="40" y="115" width="70" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="7" fill="#4a148c" text-anchor="middle" font-weight="900">FESTIVAL FAN</text>
  </g>
</svg>
