<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2c2" />
      <stop offset="50%" style="stop-color:#e8b53d" />
      <stop offset="100%" style="stop-color:#8a5e0c" />
    </linearGradient>
    <linearGradient id="enamelGrey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#455a64" />
      <stop offset="100%" style="stop-color:#263238" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <!-- Hexagon Frame -->
    <path d="M75 10 L140 45 L140 115 L75 150 L10 115 L10 45 Z" fill="url(#goldMetal)" />
    <!-- Recessed Grey Enamel -->
    <path d="M75 18 L132 50 L132 110 L75 142 L18 110 L18 50 Z" fill="url(#enamelGrey)" />
    <!-- Target Motif (Orange Enamel + Gold Metal) -->
    <circle cx="75" cy="70" r="35" fill="none" stroke="#ff5722" stroke-width="4" stroke-dasharray="10 5" />
    <path d="M60 55 L90 85 M90 55 L60 85" stroke="url(#goldMetal)" stroke-width="6" stroke-linecap="round"/>
    <!-- Gloss -->
    <path d="M18 50 Q75 30 132 50 L132 85 Q75 65 18 85 Z" fill="url(#glossSheen)" />
    <!-- Banner -->
    <rect x="40" y="115" width="70" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="7" fill="#3e2723" text-anchor="middle" font-weight="900">BOUNTY HUNTER</text>
  </g>
</svg>
