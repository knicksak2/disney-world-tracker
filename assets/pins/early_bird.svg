<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2c2" />
      <stop offset="50%" style="stop-color:#e8b53d" />
      <stop offset="100%" style="stop-color:#8a5e0c" />
    </linearGradient>
    <linearGradient id="enamelSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa726" />
      <stop offset="100%" style="stop-color:#ffeb3b" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <circle cx="75" cy="75" r="70" fill="url(#goldMetal)" />
    <circle cx="75" cy="75" r="62" fill="url(#enamelSky)" />
    <!-- Rising Sun (Raised Gold) -->
    <g transform="translate(75, 75)" fill="url(#goldMetal)">
      <circle cx="0" cy="0" r="25" />
      <path d="M0 -45 L5 -30 L-5 -30 Z" />
      <path d="M0 45 L5 30 L-5 30 Z" transform="rotate(180)" />
      <path d="M45 0 L30 5 L30 -5 Z" />
      <path d="M-45 0 L-30 5 L-30 -5 Z" transform="rotate(180)" />
      <path d="M32 -32 L25 -18 L18 -25 Z" />
      <path d="M-32 32 L-25 18 L-18 25 Z" transform="rotate(180)" />
      <path d="M32 32 L18 25 L25 18 Z" />
      <path d="M-32 -32 L-18 -25 L-25 -18 Z" transform="rotate(180)" />
    </g>
    <!-- Gloss -->
    <ellipse cx="75" cy="45" rx="55" ry="25" fill="url(#glossSheen)" transform="rotate(-15 75 45)" />
    <!-- Banner -->
    <rect x="40" y="115" width="70" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="7" fill="#e65100" text-anchor="middle" font-weight="900">EARLY BIRD</text>
  </g>
</svg>
