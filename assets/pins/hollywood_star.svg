<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2c2" />
      <stop offset="50%" style="stop-color:#e8b53d" />
      <stop offset="100%" style="stop-color:#8a5e0c" />
    </linearGradient>
    <linearGradient id="enamelPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63" />
      <stop offset="100%" style="stop-color:#c2185b" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <!-- Star Shape Frame -->
    <path d="M75 5 L91 55 L145 55 L102 85 L118 135 L75 105 L32 135 L48 85 L5 55 L59 55 Z" fill="url(#goldMetal)" />
    <!-- Recessed Enamel Star -->
    <path d="M75 15 L88 58 L133 58 L97 83 L110 125 L75 100 L40 125 L53 83 L17 58 L62 58 Z" fill="url(#enamelPink)" />
    <!-- Clapperboard Motif -->
    <g transform="translate(50, 50)" fill="url(#goldMetal)">
       <rect x="0" y="0" width="50" height="35" rx="2" stroke="#3e2723" stroke-width="0.5"/>
       <rect x="0" y="0" width="50" height="10" fill="#3e2723" />
       <path d="M5 0 L15 10 M20 0 L30 10 M35 0 L45 10" stroke="white" stroke-width="2"/>
    </g>
    <!-- Gloss -->
    <path d="M30 65 Q75 40 120 65 L110 85 Q75 60 40 85 Z" fill="url(#glossSheen)" />
    <!-- Banner -->
    <rect x="40" y="105" width="70" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="116" font-family="Arial, sans-serif" font-size="7" fill="#3e2723" text-anchor="middle" font-weight="900">HOLLYWOOD STAR</text>
  </g>
</svg>
