<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2c2" />
      <stop offset="50%" style="stop-color:#e8b53d" />
      <stop offset="100%" style="stop-color:#8a5e0c" />
    </linearGradient>
    <linearGradient id="enamelBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5" />
      <stop offset="100%" style="stop-color:#1565c0" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <rect x="20" y="15" width="110" height="120" rx="10" fill="url(#goldMetal)" />
    <rect x="28" y="22" width="94" height="106" rx="4" fill="url(#enamelBlue)" />
    <!-- Signature Book (Raised White Enamel + Gold Metal) -->
    <rect x="40" y="40" width="70" height="50" rx="2" fill="white" stroke="url(#goldMetal)" stroke-width="2"/>
    <path d="M50 75 Q75 55 100 70" fill="none" stroke="#1a237e" stroke-width="3" stroke-linecap="round"/>
    <!-- Pen (Raised Gold) -->
    <path d="M110 30 L95 60 L102 65 L117 35 Z" fill="url(#goldMetal)" stroke="#3e2723" stroke-width="0.5"/>
    <!-- Gloss -->
    <path d="M28 22 Q75 10 122 22 L122 65 Q75 50 28 65 Z" fill="url(#glossSheen)" />
    <!-- Banner -->
    <rect x="30" y="115" width="90" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="6" fill="#3e2723" text-anchor="middle" font-weight="900">CHARACTER HUNTER</text>
  </g>
</svg>
