<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f6fb" />
      <stop offset="50%" style="stop-color:#c2c9d6" />
      <stop offset="100%" style="stop-color:#7d8598" />
    </linearGradient>
    <linearGradient id="enamelBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#01579b" />
      <stop offset="100%" style="stop-color:#002f6c" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <!-- Smartphone Frame -->
    <rect x="35" y="10" width="80" height="130" rx="10" fill="url(#silverMetal)" />
    <!-- Recessed Enamel Screen -->
    <rect x="42" y="20" width="66" height="110" rx="2" fill="url(#enamelBlue)" />
    <!-- Success Check (Raised Silver) -->
    <path d="M55 75 L70 90 L100 60" fill="none" stroke="url(#silverMetal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Gloss -->
    <path d="M42 20 Q75 10 108 20 L108 60 Q75 45 42 60 Z" fill="url(#glossSheen)" />
    <!-- Banner -->
    <rect x="40" y="115" width="70" height="15" rx="7.5" fill="url(#silverMetal)" />
    <text x="75" y="126" font-family="Arial, sans-serif" font-size="6" fill="#37474f" text-anchor="middle" font-weight="900">VIRTUAL QUEUE ACE</text>
  </g>
</svg>
