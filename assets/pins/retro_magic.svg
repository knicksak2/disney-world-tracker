<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2c2" />
      <stop offset="50%" style="stop-color:#e8b53d" />
      <stop offset="100%" style="stop-color:#8a5e0c" />
    </linearGradient>
    <linearGradient id="enamelRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336" />
      <stop offset="100%" style="stop-color:#c62828" />
    </linearGradient>
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <filter id="pinShadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#pinShadow)">
    <!-- Ticket Shape Frame (Gold) -->
    <path d="M15 45 L135 45 C145 45 145 55 135 55 A10 10 0 0 0 135 95 C145 95 145 105 135 105 L15 105 C5 105 5 95 15 95 A10 10 0 0 0 15 55 C5 55 5 45 15 45 Z" fill="url(#goldMetal)" />
    <!-- Recessed Red Enamel -->
    <path d="M22 52 L128 52 C133 52 133 58 128 58 A7 7 0 0 1 128 92 C133 92 133 98 128 98 L22 98 C17 98 17 92 22 92 A7 7 0 0 1 22 58 C17 58 17 52 22 52 Z" fill="url(#enamelRed)" />
    <!-- Ticket Text (Raised Gold) -->
    <text x="75" y="78" font-family="Courier New, monospace" font-size="10" fill="url(#goldMetal)" text-anchor="middle" font-weight="900">ADMIT ONE</text>
    <!-- Perforations (Gold dots) -->
    <circle cx="35" cy="65" r="1.5" fill="url(#goldMetal)" />
    <circle cx="35" cy="85" r="1.5" fill="url(#goldMetal)" />
    <circle cx="115" cy="65" r="1.5" fill="url(#goldMetal)" />
    <circle cx="115" cy="85" r="1.5" fill="url(#goldMetal)" />
    <!-- Gloss -->
    <path d="M22 52 Q75 40 128 52 L128 75 Q75 60 22 75 Z" fill="url(#glossSheen)" />
    <!-- Banner -->
    <rect x="45" y="110" width="60" height="15" rx="7.5" fill="url(#goldMetal)" />
    <text x="75" y="121" font-family="Arial, sans-serif" font-size="7" fill="#3e2723" text-anchor="middle" font-weight="900">RETRO MAGIC</text>
  </g>
</svg>
